# Admin SPA + reverse proxy to the API (one origin: no CORS needed).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Uploads (MAX_UPLOAD_MB=80 per file, several files per request).
  client_max_body_size 400m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-sent events (live render progress) must not be buffered.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # Preview frames may wait up to a minute for a busy worker.
    proxy_send_timeout 90s;
  }

  # Hashed build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes.
  location / {
    try_files $uri /index.html;
  }
}
